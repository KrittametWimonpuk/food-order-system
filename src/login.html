<script>
/* ==========================================================================
   login.html — Screen 01: Login (Employee ID + PIN)
   ========================================================================== */
'use strict';

var Login = {
  /** Renders the login screen. */
  render: function (notice) {
    Desk.stop();
    document.body.classList.remove('mode-mobile');
    var company = (App.state.app && App.state.app.companyName) || window.COMPANY_NAME || 'โรงงาน ABC';
    var lastCode = Store.get('lastCode') || '';
    App.root.innerHTML =
      '<div class="login-screen"><div class="card login-card">' +
      '<div class="login-logo" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 30h48a24 22 0 0 1-48 0z" fill="rgba(255,255,255,.18)"/><path d="M20 60h24M32 52v8"/><path d="M22 20c0-4 3-5 3-9M32 20c0-4 3-5 3-9M42 20c0-4 3-5 3-9"/></svg></div>' +
      '<h1 class="login-title">ระบบจองอาหาร</h1><p class="login-sub" id="loginCompany">' + esc(company) + '</p>' +
      '<div id="loginAlert"></div>' +
      '<form id="loginForm" novalidate autocomplete="on">' +
      '<div class="form-group"><label class="form-label" for="empCode">รหัสพนักงาน</label>' +
      '<div class="input-icon">' + icon('user') + '<input class="form-control" id="empCode" name="username" autocomplete="username" autocapitalize="characters" spellcheck="false" placeholder="เช่น EMP00125" maxlength="20" value="' + esc(lastCode) + '" required></div></div>' +
      '<div class="form-group"><label class="form-label" for="empPin">PIN</label>' +
      '<div class="input-icon">' + icon('lock') + '<input class="form-control pin-input" id="empPin" name="password" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••••" maxlength="8" required style="padding-right:52px">' +
      '<button type="button" class="btn btn-ghost btn-icon input-action" id="togglePin" aria-label="แสดง PIN" aria-pressed="false">' + icon('eye') + '</button></div></div>' +
      '<div class="row-between mb-16"><label class="check"><input type="checkbox" id="remember"' + (Store.get('remember') === '1' ? ' checked' : '') + '> จำฉันไว้ในอุปกรณ์นี้</label>' +
      '<a href="#" id="forgotPin" class="fw-600">ลืม PIN ?</a></div>' +
      '<button type="submit" class="btn btn-primary btn-lg btn-block" id="loginBtn"><span>เข้าสู่ระบบ</span></button>' +
      '</form>' +
      '<div class="login-foot">Factory Food Ordering System · v' + esc((App.state.app && App.state.app.version) || '1.0.0') + '</div>' +
      '</div></div>';
    if (notice) Login.alert(notice, 'warning');
    $('#togglePin').onclick = function () {
      var inp = $('#empPin');
      var show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      this.innerHTML = icon(show ? 'eyeOff' : 'eye');
      this.setAttribute('aria-label', show ? 'ซ่อน PIN' : 'แสดง PIN');
      this.setAttribute('aria-pressed', show ? 'true' : 'false');
    };
    $('#empPin').addEventListener('input', function () { this.value = this.value.replace(/\D/g, ''); });
    $('#loginForm').onsubmit = function (e) { e.preventDefault(); Login.submit(); };
    $('#forgotPin').onclick = function (e) { e.preventDefault(); Login.forgot(); };
    focusSoon(function () { return lastCode ? $('#empPin') : $('#empCode'); }, 60);
    if (!App.state.app) apiCall('app.info').then(function (info) {
      App.state.app = info;
      var c = $('#loginCompany');
      if (c) c.textContent = info.companyName;
    }).catch(function () { /* offline: keep defaults */ });
  },

  alert: function (msg, type) {
    var box = $('#loginAlert');
    if (!box) return;
    box.innerHTML = msg ? '<div class="login-alert ' + (type || '') + '" role="alert">' + icon(type === 'warning' ? 'alert' : 'xCircle') + '<div>' + esc(msg) + '</div></div>' : '';
  },

  /** Submits credentials. */
  submit: function () {
    var btn = $('#loginBtn');
    var code = $('#empCode').value.trim().toUpperCase();
    var pin = $('#empPin').value.trim();
    var remember = $('#remember').checked;
    Login.alert('');
    if (!code) { Login.alert('กรุณากรอกรหัสพนักงาน'); $('#empCode').focus(); return; }
    if (!/^\d{4,8}$/.test(pin)) { Login.alert('กรุณากรอก PIN เป็นตัวเลข 4-8 หลัก'); $('#empPin').focus(); return; }
    guard(btn, function () {
      return apiCall('auth.login', { employeeCode: code, pin: pin, remember: remember, userAgent: navigator.userAgent.substring(0, 180) })
        .then(function (data) {
          Store.set('lastCode', code);
          Store.set('remember', remember ? '1' : '0');
          showToast('ยินดีต้อนรับ ' + data.user.name, 'success');
          return App.onLogin(data, remember);
        })
        .catch(function (e) {
          var type = e.code === 'EMPLOYEE_DISABLED' || e.code === 'AUTH_LOCKED' || e.code === 'AUTH_RATE_LIMIT' ? 'warning' : '';
          Login.alert(e.message || 'เข้าสู่ระบบไม่สำเร็จ', type);
          var p = $('#empPin');
          if (p) { p.value = ''; p.focus(); }
        });
    });
  },

  /** "Forgot PIN" dialog: sends a reset request to admins. */
  forgot: function () {
    var code = ($('#empCode') && $('#empCode').value.trim().toUpperCase()) || '';
    openModal({
      title: 'ลืม PIN ?',
      sheet: true,
      body: '<p class="muted mb-12">กรอกรหัสพนักงาน ระบบจะแจ้งผู้ดูแลระบบ (Admin/HR) เพื่อรีเซ็ต PIN ให้ จากนั้นติดต่อรับ PIN ใหม่ที่ฝ่ายบุคคล</p>' +
        formField({ name: 'code', label: 'รหัสพนักงาน', value: code, required: true, placeholder: 'เช่น EMP00125' }),
      actions: [
        { text: 'ยกเลิก' },
        {
          text: 'ส่งคำขอ', cls: 'btn-primary', icon: 'send', onClick: function (m) {
            var v = $('#f_code').value.trim().toUpperCase();
            if (!v) { showToast('กรุณากรอกรหัสพนักงาน', 'warning'); return; }
            return apiCall('auth.forgotPin', { employeeCode: v }).then(function (d) {
              m.close();
              showToast(d.message, 'success', 6000);
            });
          }
        }
      ]
    });
  }
};
</script>
