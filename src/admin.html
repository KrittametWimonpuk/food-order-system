<script>
/* ==========================================================================
   admin.html — Admin / Viewer screens
   10 Admin Dashboard · 11 Menu · 12 Daily Menu · 13 Meal Windows · 14 Employees
   16 Reports · 17 LINE · 18 Settings · 19 Audit Log · 20 Error/System Log · 21 Backup
   ========================================================================== */
'use strict';

function isAdmin() { return App.state.user.role === 'ADMIN'; }

/* ---------------- 10 Admin Dashboard ---------------- */
Desk.register('a-dashboard', {
  title: 'หน้าหลัก', icon: 'home', roles: ['ADMIN', 'VIEWER'],
  render: function (el) {
    var load = function (silent) {
      return apiCall('admin.dashboard', { days: 14 }).then(function (d) {
        if (Desk.current !== 'a-dashboard') return;
        var k = d.kpi;
        var health = d.health;
        var warn = health && health.warnings.length ? health.warnings.map(function (w) {
          return '<div class="alert alert-' + (w.level === 'danger' ? 'danger' : 'warning') + '">' + icon('alert') + '<div>' + esc(w.text) + '</div>' + (w.page ? '<button class="btn btn-sm btn-outline" data-goto="' + esc(w.page) + '">ตั้งค่า</button>' : '') + '</div>';
        }).join('') : '';
        var windowsHtml = d.windows.length ? d.windows.map(function (w) {
          return '<div class="row-between" style="padding:10px 0;border-bottom:1px solid var(--border-2)"><div class="row">' + mealIcon(w.meal) + '<div><div class="fw-600">' + esc(w.meal_th) + '</div><div class="text-sm muted">เปิด ' + esc(formatTime(w.open_at, true)) + ' · ปิด ' + esc(formatTime(w.close_at, true)) + ' · รับ ' + esc(formatTime(w.pickup_start, true)) + '–' + esc(formatTime(w.pickup_end, true)) + '</div></div></div>' + renderStatus(w.status) + '</div>';
        }).join('') : emptyState('วันนี้ยังไม่มีมื้ออาหาร', isAdmin() ? 'สร้างมื้ออาหารได้ที่เมนู "จัดการมื้ออาหาร"' : '', 'calendar');
        el.innerHTML = warn +
          '<div class="page-head"><div><h2>ภาพรวมวันนี้</h2><div class="muted">' + esc(d.date_th) + '</div></div><div class="ph-actions"><button class="btn btn-soft btn-sm" id="adRefresh">' + icon('refresh', 'icon-sm') + '<span>รีเฟรช</span></button></div></div>' +
          '<div class="kpi-grid">' + kpiCard('Orders วันนี้', formatNumber(k.orders), 'clipboard', '', 'พนักงานสั่ง ' + d.employees.orderedToday + '/' + d.employees.active + ' คน') +
          kpiCard('จำนวนกล่อง', formatNumber(k.qty), 'package', 'navy') + kpiCard('รายได้', formatMoney(k.revenue), 'chart', 'success') +
          kpiCard('ยกเลิก / ไม่มารับ', formatNumber(k.cancelled) + ' / ' + formatNumber(k.no_show), 'xCircle', 'danger') + '</div>' +
          '<div class="grid-2"><div class="card"><div class="card-header"><div class="card-title">' + icon('chart') + 'แนวโน้ม Order 14 วัน</div><span class="card-sub">จำนวน Order ต่อวัน</span></div><div class="card-body">' +
          columnChart(d.trend.map(function (t) { var dd = parseLocal(t.date); var p = bkkParts(dd); return { label: p.d + '/' + (p.m + 1), value: t.orders, tip: formatDate(t.date, true) + ': ' + t.orders + ' Order · ' + t.qty + ' กล่อง · ' + formatMoney(t.revenue) }; }), { label: 'จำนวน Order รายวัน' }) + '</div></div>' +
          '<div class="card"><div class="card-header"><div class="card-title">' + icon('calendar') + 'มื้ออาหารวันนี้</div></div><div class="card-body" style="padding-top:6px">' + windowsHtml + '</div></div></div>' +
          '<div class="grid-2 mt-16"><div class="card"><div class="card-header"><div class="card-title">' + icon('bowl') + 'เมนูยอดนิยมวันนี้</div><span class="card-sub">กล่อง</span></div><div class="card-body">' +
          hbarChart(d.byMenu.map(function (m) { return { label: m.name, value: m.qty }; }), { unit: 'กล่อง', emptyTitle: 'ยังไม่มีรายการสั่งอาหารวันนี้' }) + '</div></div>' +
          '<div class="card"><div class="card-header"><div class="card-title">' + icon('pie') + 'ตามแผนก</div></div><div class="card-body">' +
          donutChart(d.byDepartment.map(function (x) { return { label: x.department, value: x.qty }; }), { centerLabel: 'กล่อง', emptyTitle: 'ยังไม่มีข้อมูล' }) + '</div></div></div>' +
          (health ? '<p class="muted text-sm mt-12">Scheduler ทำงานล่าสุด: ' + esc(health.schedulerLastRun ? formatDateTime(health.schedulerLastRun) : 'ยังไม่เคยทำงาน (ติดตั้ง Trigger ที่หน้าตั้งค่าระบบ)') + '</p>' : '');
        bindVizTips(el);
        $('#adRefresh').onclick = function () { guard(this, function () { return load(); }); };
        $all('[data-goto]', el).forEach(function (b) { b.onclick = function () { Desk.go(b.dataset.goto); }; });
      }).catch(function (e) { if (!e.handled && !silent) el.innerHTML = errorBlock(e); });
    };
    load();
    Desk.every(60000, function () { load(true); });
  }
});

/* ---------------- 11 Menu Management ---------------- */
Desk.register('menu', {
  title: 'จัดการเมนู', icon: 'bowl', roles: ['ADMIN'],
  render: function (el) {
    var state = { q: '', includeDeleted: false, rows: [], categories: [] };
    el.innerHTML = '<div class="card"><div class="toolbar"><div class="input-icon search">' + icon('search') + '<input class="form-control form-control-sm" id="mnQ" type="search" placeholder="ค้นหาเมนู / รหัส / หมวด" aria-label="ค้นหาเมนู"></div>' +
      '<label class="check text-sm"><input type="checkbox" id="mnDel"> แสดงเมนูที่ลบแล้ว</label><span class="grow"></span>' +
      '<button class="btn btn-primary btn-sm" id="mnAdd">' + icon('plus', 'icon-sm') + '<span>เพิ่มเมนู</span></button></div><div id="mnTable">' + skeleton(3) + '</div></div>';
    var load = function () {
      return apiCall('menu.list', { q: state.q, includeDeleted: state.includeDeleted }).then(function (d) {
        state.rows = d.rows; state.categories = d.categories;
        var box = $('#mnTable');
        if (!d.rows.length) { box.innerHTML = emptyState(state.q ? 'ไม่พบเมนูที่ค้นหา' : 'ยังไม่มีเมนูอาหาร', state.q ? '' : 'เริ่มต้นด้วยการเพิ่มเมนูแรก', 'bowl'); return; }
        box.innerHTML = '<div class="table-wrap"><table class="table"><thead><tr><th>รูป</th><th>เมนู</th><th>หมวด</th><th class="num">ราคา</th><th class="num">จำนวนสูงสุด</th><th class="num">ขายแล้ว (วันนี้)</th><th>สถานะ</th><th class="actions">จัดการ</th></tr></thead><tbody>' +
          d.rows.map(function (m) {
            return '<tr class="' + (m.is_deleted ? 'row-dim' : '') + '"><td>' + foodImage(m, 'table-thumb menu-img') + '</td><td><div class="fw-600">' + esc(m.name) + '</div><div class="text-xs muted mono">' + esc(m.code) + '</div></td><td>' + esc(m.category || '-') + '</td>' +
              '<td class="num">' + formatMoney(m.default_price) + '</td><td class="num">' + m.default_stock + (m.max_per_order ? '<div class="text-xs muted">สูงสุด ' + m.max_per_order + '/Order</div>' : '') + '</td><td class="num">' + m.sold_today + (m.stock_today ? ' / ' + m.stock_today : '') + '</td>' +
              '<td>' + (m.is_deleted ? '<span class="badge badge-danger">ลบแล้ว</span>' : '<label class="switch" title="เปิด/ปิดเมนู"><input type="checkbox" data-toggle="' + esc(m.item_id) + '"' + (m.status === 'ACTIVE' ? ' checked' : '') + ' aria-label="เปิด/ปิด ' + esc(m.name) + '"><span class="track"></span></label>') + '</td>' +
              '<td class="actions">' + (m.is_deleted ? '<button class="btn btn-outline btn-sm" data-restore="' + esc(m.item_id) + '">กู้คืน</button>' :
                '<button class="btn btn-outline btn-sm btn-icon" data-edit="' + esc(m.item_id) + '" aria-label="แก้ไข ' + esc(m.name) + '">' + icon('edit', 'icon-sm') + '</button><button class="btn btn-outline-danger btn-sm btn-icon" data-del="' + esc(m.item_id) + '" aria-label="ลบ ' + esc(m.name) + '">' + icon('trash', 'icon-sm') + '</button>') + '</td></tr>';
          }).join('') + '</tbody></table></div>';
        $all('[data-edit]', box).forEach(function (b) { b.onclick = function () { editMenu(state.rows.filter(function (x) { return x.item_id === b.dataset.edit; })[0]); }; });
        $all('[data-toggle]', box).forEach(function (c) {
          c.onchange = function () {
            var on = c.checked;
            c.disabled = true;
            apiCall('menu.toggle', { item_id: c.dataset.toggle, status: on ? 'ACTIVE' : 'INACTIVE' }).then(function () { showToast(on ? 'เปิดใช้งานเมนูแล้ว' : 'ปิดใช้งานเมนูแล้ว', 'success', 2000); })
              .catch(function (e) { c.checked = !on; if (!e.handled) showToast(e.message, 'error'); }).then(function () { c.disabled = false; });
          };
        });
        $all('[data-del]', box).forEach(function (b) {
          b.onclick = function () {
            var m = state.rows.filter(function (x) { return x.item_id === b.dataset.del; })[0];
            confirmModal('ลบเมนู "' + m.name + '" ?', { danger: true, okText: 'ลบเมนู', detail: 'เป็นการลบแบบ Soft Delete — ประวัติ Order เดิมไม่ได้รับผลกระทบ และกู้คืนได้' }).then(function (ok) {
              if (ok) guard(b, function () { return apiCall('menu.delete', { item_id: m.item_id }).then(function () { showToast('ลบเมนูแล้ว', 'success'); return load(); }); });
            });
          };
        });
        $all('[data-restore]', box).forEach(function (b) { b.onclick = function () { guard(b, function () { return apiCall('menu.restore', { item_id: b.dataset.restore }).then(function () { showToast('กู้คืนเมนูแล้ว (สถานะปิดใช้งาน)', 'success'); return load(); }); }); }; });
      }).catch(function (e) { if (!e.handled) $('#mnTable').innerHTML = errorBlock(e); });
    };
    var editMenu = function (m) {
      m = m || { name: '', code: '', description: '', category: state.categories[0] || '', default_price: '', default_stock: 50, max_per_order: 0, image_url: '', status: 'ACTIVE', sort_order: state.rows.length + 1 };
      var body = h('<form class="form-grid" novalidate>' +
        formField({ name: 'name', label: 'ชื่อเมนู', value: m.name, required: true, max: 100, span2: true }) +
        formField({ name: 'code', label: 'รหัสเมนู', value: m.code, placeholder: 'เว้นว่าง = สร้างอัตโนมัติ', max: 20 }) +
        formField({ name: 'category', label: 'หมวดหมู่', type: 'select', value: m.category, options: [''].concat(state.categories).map(function (c) { return { value: c, label: c || '- ไม่ระบุ -' }; }) }) +
        formField({ name: 'default_price', label: 'ราคา (บาท)', type: 'number', value: m.default_price, required: true, min: 0, step: '0.5', inputmode: 'decimal' }) +
        formField({ name: 'default_stock', label: 'จำนวนสูงสุด/มื้อ (Stock Limit)', type: 'number', value: m.default_stock, required: true, min: 0, inputmode: 'numeric' }) +
        formField({ name: 'max_per_order', label: 'สั่งได้สูงสุดต่อ Order', type: 'number', value: m.max_per_order, min: 0, hint: '0 = ไม่จำกัด (ใช้ค่าระบบ)', inputmode: 'numeric' }) +
        formField({ name: 'sort_order', label: 'ลำดับการแสดง', type: 'number', value: m.sort_order, min: 0, inputmode: 'numeric' }) +
        formField({ name: 'description', label: 'รายละเอียด', type: 'textarea', value: m.description, max: 300, span2: true }) +
        '<div class="form-group span-2"><label class="form-label" for="f_image_url">รูปภาพ (URL https:// หรืออัปโหลด)</label><div class="row"><input class="form-control" id="f_image_url" name="image_url" value="' + esc(m.image_url) + '" placeholder="https://..."><label class="btn btn-outline" for="imgFile">' + icon('upload') + '<span>อัปโหลด</span></label><input type="file" id="imgFile" accept="image/png,image/jpeg,image/webp,image/gif" class="sr-only"></div><div class="form-hint">ไฟล์ไม่เกิน 2MB จะถูกเก็บใน Google Drive โฟลเดอร์ FoodFactory-Images</div><div id="imgPrev" class="mt-8"></div></div>' +
        formField({ name: 'status', label: 'สถานะ', type: 'select', value: m.status, options: [{ value: 'ACTIVE', label: 'เปิดใช้งาน' }, { value: 'INACTIVE', label: 'ปิดใช้งาน' }] }) +
        '</form>');
      var preview = function () { var u = $('#f_image_url', body).value.trim(); $('#imgPrev', body).innerHTML = u ? foodImage({ name: $('#f_name', body).value, image_url: u }, 'table-thumb menu-img') : ''; };
      openModal({
        title: m.item_id ? 'แก้ไขเมนู' : 'เพิ่มเมนู', size: 'lg', body: body,
        actions: [{ text: 'ยกเลิก' }, { text: 'บันทึก', cls: 'btn-primary', icon: 'check', onClick: function (modal) {
          if (!checkRequired(body)) return;
          var v = readForm(body);
          v.item_id = m.item_id || '';
          return apiCall('menu.save', v).then(function () { modal.close(); showToast('บันทึกเมนูแล้ว', 'success'); return load(); });
        } }]
      });
      preview();
      $('#f_image_url', body).oninput = debounce(preview, 400);
      $('#imgFile', body).onchange = function () {
        var f = this.files[0];
        if (!f) return;
        if (f.size > 2 * 1024 * 1024) { showToast('ไฟล์ต้องไม่เกิน 2MB', 'warning'); return; }
        showLoading('กำลังอัปโหลดรูป...');
        readFileBase64(f).then(function (b64) { return apiCall('menu.upload', { fileName: f.name, mimeType: f.type, data: b64 }); })
          .then(function (r) { $('#f_image_url', body).value = r.url; preview(); showToast(r.shared ? 'อัปโหลดรูปแล้ว' : 'อัปโหลดแล้ว แต่ตั้งค่าแชร์ไม่สำเร็จ (รูปอาจไม่แสดง)', r.shared ? 'success' : 'warning'); })
          .catch(function (e) { if (!e.handled) showToast(e.message || 'อัปโหลดไม่สำเร็จ', 'error'); })
          .then(function () { hideLoading(); });
      };
    };
    $('#mnAdd').onclick = function () { editMenu(null); };
    $('#mnQ').oninput = debounce(function () { state.q = $('#mnQ').value.trim(); load(); }, 300);
    $('#mnDel').onchange = function () { state.includeDeleted = this.checked; load(); };
    load();
  }
});

/* ---------------- 12 Daily Menu ---------------- */
function DailyMenuPage(el, params, admin) {
  var pageKey = admin ? 'daily' : 'k-daily';
  var state = { date: params.date || isoDate(serverNow()), window_id: params.window_id || '' };
  el.innerHTML = '<div class="card"><div class="toolbar"><input type="date" class="form-control form-control-sm" id="dmDate" value="' + esc(state.date) + '" aria-label="วันที่" style="width:auto"><select class="form-control form-control-sm" id="dmWin" aria-label="มื้อ" style="width:auto"></select><span class="grow"></span>' +
    (admin ? '<button class="btn btn-outline btn-sm" id="dmCopy">' + icon('copy', 'icon-sm') + '<span>ใส่เมนูที่เปิดใช้งานทั้งหมด</span></button><button class="btn btn-outline btn-sm" id="dmRecalc" title="คำนวณจำนวนที่ขายใหม่จาก Order จริง">' + icon('refresh', 'icon-sm') + '<span>คำนวณสต็อกใหม่</span></button><button class="btn btn-primary btn-sm" id="dmAdd">' + icon('plus', 'icon-sm') + '<span>เพิ่มเมนูเข้ามื้อนี้</span></button>' : '') +
    '</div><div id="dmInfo"></div><div id="dmTable">' + skeleton(3) + '</div></div>';
  var loadWindows = function () {
    return apiCall('meal.list', { from: state.date, to: state.date }).then(function (d) {
      var ws = d.rows;
      var sel = $('#dmWin');
      if (!ws.length) {
        sel.innerHTML = '<option value="">ไม่มีมื้ออาหาร</option>';
        state.window_id = '';
        $('#dmInfo').innerHTML = '';
        $('#dmTable').innerHTML = emptyState('ยังไม่มีมื้ออาหารในวันนี้', admin ? 'สร้างมื้ออาหารก่อนที่หน้า "จัดการมื้ออาหาร"' : '', 'calendar', admin ? '<button class="btn btn-primary" id="dmGoMeal">' + icon('calendar') + '<span>จัดการมื้ออาหาร</span></button>' : '');
        var g = $('#dmGoMeal'); if (g) g.onclick = function () { Desk.go('meals'); };
        return;
      }
      if (!ws.some(function (w) { return w.window_id === state.window_id; })) {
        var open = ws.filter(function (w) { return w.status === 'OPEN'; })[0];
        state.window_id = (open || ws[0]).window_id;
      }
      sel.innerHTML = windowOptions(ws, state.window_id);
      return load();
    }).catch(function (e) { if (!e.handled) $('#dmTable').innerHTML = errorBlock(e); });
  };
  var load = function () {
    if (!state.window_id) return Promise.resolve();
    return apiCall('daily.list', { window_id: state.window_id }).then(function (d) {
      if (Desk.current !== pageKey) return;
      state.available = d.available;
      var w = d.window;
      $('#dmInfo').innerHTML = '<div class="toolbar" style="border-bottom:0;padding-bottom:0"><span>' + mealIcon(w.meal) + ' <b>' + esc(w.meal_th) + '</b> ' + esc(formatDate(w.date)) + '</span>' + renderStatus(w.status) + '<span class="muted text-sm">เปิด ' + esc(formatTime(w.open_at, true)) + ' · ปิด ' + esc(formatTime(w.close_at, true)) + '</span></div>';
      var box = $('#dmTable');
      if (!d.rows.length) { box.innerHTML = emptyState('วันนี้ยังไม่มีเมนูอาหาร', admin ? 'กด "เพิ่มเมนูเข้ามื้อนี้" หรือ "ใส่เมนูที่เปิดใช้งานทั้งหมด"' : 'ผู้ดูแลระบบยังไม่ได้เพิ่มเมนู', 'bowl'); return; }
      box.innerHTML = '<div class="table-wrap"><table class="table"><thead><tr><th>รูป</th><th>เมนู</th><th class="num">ราคา</th><th class="num">จำนวน (Stock)</th><th class="num">ขายแล้ว</th><th class="num">เหลือ</th><th class="num">สูงสุด/Order</th><th>สถานะ</th><th class="actions">จัดการ</th></tr></thead><tbody>' +
        d.rows.map(function (r) {
          return '<tr><td>' + foodImage(r, 'table-thumb menu-img') + '</td><td class="fw-600">' + esc(r.name) + '</td><td class="num">' + formatMoney(r.price) + '</td><td class="num">' + r.stock_limit + '</td><td class="num">' + r.sold_qty + '</td><td class="num fw-700">' + r.remaining + '</td><td class="num">' + (r.max_per_order || '-') + '</td><td>' + renderStatus(r.status) + '</td>' +
            '<td class="actions">' + (r.stored_status === 'AVAILABLE' ? '<button class="btn btn-outline btn-sm" data-st="SOLD_OUT" data-id="' + esc(r.daily_menu_id) + '">ปิดการขาย</button>' : '<button class="btn btn-outline btn-sm" data-st="AVAILABLE" data-id="' + esc(r.daily_menu_id) + '">เปิดขาย</button>') +
            (admin ? '<button class="btn btn-outline btn-sm btn-icon" data-edit="' + esc(r.daily_menu_id) + '" aria-label="แก้ไข ' + esc(r.name) + '">' + icon('edit', 'icon-sm') + '</button><button class="btn btn-outline-danger btn-sm btn-icon" data-rm="' + esc(r.daily_menu_id) + '" aria-label="นำออก ' + esc(r.name) + '">' + icon('trash', 'icon-sm') + '</button>' : '') + '</td></tr>';
        }).join('') + '</tbody></table></div>';
      $all('[data-st]', box).forEach(function (b) {
        b.onclick = function () { guard(b, function () { return apiCall('daily.save', { daily_menu_id: b.dataset.id, status: b.dataset.st }).then(function () { showToast(b.dataset.st === 'AVAILABLE' ? 'เปิดขายแล้ว' : 'ปิดการขายแล้ว', 'success', 2000); return load(); }); }); };
      });
      $all('[data-edit]', box).forEach(function (b) {
        var r = d.rows.filter(function (x) { return x.daily_menu_id === b.dataset.edit; })[0];
        b.onclick = function () {
          var body = h('<form novalidate>' + '<p class="fw-700 mb-12">' + esc(r.name) + '</p>' +
            formField({ name: 'price', label: 'ราคาวันนี้ (บาท)', type: 'number', value: r.price, required: true, min: 0, step: '0.5' }) +
            formField({ name: 'stock_limit', label: 'จำนวนสูงสุด (Stock)', type: 'number', value: r.stock_limit, required: true, min: r.sold_qty, hint: 'ขายไปแล้ว ' + r.sold_qty + ' กล่อง' }) +
            formField({ name: 'max_per_order', label: 'สั่งได้สูงสุดต่อ Order', type: 'number', value: r.max_per_order, min: 0, hint: '0 = ไม่จำกัด' }) + '</form>');
          openModal({ title: 'แก้ไขเมนูประจำวัน', body: body, actions: [{ text: 'ยกเลิก' }, { text: 'บันทึก', cls: 'btn-primary', onClick: function (m) {
            if (!checkRequired(body)) return;
            var v = readForm(body);
            v.daily_menu_id = r.daily_menu_id;
            return apiCall('daily.save', v).then(function () { m.close(); showToast('บันทึกแล้ว', 'success'); return load(); });
          } }] });
        };
      });
      $all('[data-rm]', box).forEach(function (b) {
        var r = d.rows.filter(function (x) { return x.daily_menu_id === b.dataset.rm; })[0];
        b.onclick = function () {

function LogPage(el, cfg) {
  var state = { tab: cfg.tabs[0].key, q: '', date: '', page: 1 };
  el.innerHTML = '<div class="card">' + (cfg.tabs.length > 1 ? '<div class="filter-pills">' + cfg.tabs.map(function (t) { return '<button class="pill' + (t.key === state.tab ? ' active' : '') + '" data-lt="' + t.key + '">' + esc(t.label) + '</button>'; }).join('') + '</div>' : '') +
    '<div class="toolbar"><div class="input-icon search">' + icon('search') + '<input class="form-control form-control-sm" id="lgQ" type="search" placeholder="ค้นหา..." aria-label="ค้นหา log"></div><input type="date" class="form-control form-control-sm" id="lgDate" aria-label="วันที่" style="width:auto"><span class="grow"></span><button class="btn btn-soft btn-sm" id="lgRefresh">' + icon('refresh', 'icon-sm') + '<span>รีเฟรช</span></button></div><div id="lgTable">' + skeleton(4) + '</div></div>';
  var load = function () {
    var t = cfg.tabs.filter(function (x) { return x.key === state.tab; })[0];
    return apiCall(t.action, { q: state.q, date: state.date, page: state.page, pageSize: 50 }).then(function (d) {
      var box = $('#lgTable');
      if (!box) return;
      if (!d.rows.length) { box.innerHTML = emptyState('ไม่พบข้อมูล', state.q || state.date ? 'ลองเปลี่ยนเงื่อนไขการค้นหา' : 'ยังไม่มีบันทึก', 'shield'); return; }
      box.innerHTML = '<div class="table-wrap"><table class="table"><thead><tr>' + t.cols.map(function (c) { return '<th>' + esc(c[1]) + '</th>'; }).join('') + '</tr></thead><tbody>' +
        d.rows.map(function (r) { return '<tr>' + t.cols.map(function (c) { var v = r[c[0]]; if (c[0] === 'timestamp') return '<td class="nowrap text-sm">' + esc(formatDateTime(v)) + '</td>'; return '<td class="text-sm" style="max-width:320px;word-break:break-word">' + esc(v && String(v).length > 300 ? String(v).substring(0, 300) + '…' : v) + '</td>'; }).join('') + '</tr>'; }).join('') +
        '</tbody></table></div>' + pagerHtml(d.page, Math.max(1, Math.ceil(d.total / d.pageSize)), d.total);
      bindPager(box, function (p) { state.page = p; load(); });
    }).catch(function (e) { if (!e.handled) $('#lgTable').innerHTML = errorBlock(e); });
  };
  $all('[data-lt]', el).forEach(function (b) { b.onclick = function () { state.tab = b.dataset.lt; state.page = 1; $all('[data-lt]', el).forEach(function (x) { x.classList.toggle('active', x === b); }); load(); }; });
  $('#lgQ').oninput = debounce(function () { state.q = $('#lgQ').value.trim(); state.page = 1; load(); }, 350);
  $('#lgDate').onchange = function () { state.date = this.value; state.page = 1; load(); };
  $('#lgRefresh').onclick = function () { guard(this, load); };
  load();
}

  title: 'ตั้งค่าระบบ', icon: 'settings', roles: ['ADMIN'],

      { title: 'LINE Notification', icon: 'message', keys: ['LINE_ENABLED', 'LINE_NOTIFICATION_MODE', 'SUMMARY_INTERVAL_MINUTES', 'LINE_WEBHOOK_CAPTURE'] },
      { title: 'ความปลอดภัย', icon: 'lock', keys: ['SESSION_TIMEOUT_MINUTES', 'REMEMBER_DAYS', 'LOGIN_MAX_ATTEMPTS', 'LOGIN_LOCK_MINUTES', 'PIN_MIN_LENGTH'] },

    ];
    var labels = { COMPANY_NAME: 'ชื่อบริษัท', DEPARTMENTS: 'แผนก', MENU_CATEGORIES: 'หมวดหมู่เมนู', PAYMENT_METHOD: 'วิธีชำระเงิน', MAX_QTY_PER_ORDER: 'Max Qty ต่อ Order (0 = ไม่จำกัด)', ALLOW_EDIT: 'อนุญาตแก้ไข Order', ALLOW_CANCEL: 'อนุญาตยกเลิก Order', ALLOW_MULTIPLE_ORDERS: 'สั่งได้หลาย Order ต่อมื้อ', AUTO_NO_SHOW: 'ไม่มารับอัตโนมัติ (NO_SHOW)', AUTO_CREATE_WINDOW: 'สร้างมื้ออัตโนมัติทุกวัน', AUTO_DAILY_MENU: 'ใส่เมนูอัตโนมัติ', DEFAULT_MEALS: 'มื้อที่สร้างอัตโนมัติ', WORKING_DAYS: 'วันทำงาน', LUNCH_OPEN_TIME: 'กลางวัน: Default Open Time', LUNCH_CLOSE_TIME: 'กลางวัน: Default Close Time', LUNCH_PICKUP_START: 'กลางวัน: Pickup Start', LUNCH_PICKUP_END: 'กลางวัน: Pickup End', BREAKFAST_OPEN_TIME: 'เช้า: เปิดรับ', BREAKFAST_CLOSE_TIME: 'เช้า: ปิดรับ', BREAKFAST_PICKUP_START: 'เช้า: เริ่มรับอาหาร', BREAKFAST_PICKUP_END: 'เช้า: สิ้นสุดรับอาหาร', DINNER_OPEN_TIME: 'เย็น: เปิดรับ', DINNER_CLOSE_TIME: 'เย็น: ปิดรับ', DINNER_PICKUP_START: 'เย็น: เริ่มรับอาหาร', DINNER_PICKUP_END: 'เย็น: สิ้นสุดรับอาหาร', LINE_ENABLED: 'เปิดการส่ง LINE', LINE_NOTIFICATION_MODE: 'LINE Notification Mode', SUMMARY_INTERVAL_MINUTES: 'Summary Interval (นาที)', LINE_WEBHOOK_CAPTURE: 'บันทึก Group ID จาก Webhook', SESSION_TIMEOUT_MINUTES: 'Session Timeout (นาที)', REMEMBER_DAYS: 'จำการเข้าสู่ระบบ (วัน)', LOGIN_MAX_ATTEMPTS: 'ใส่ PIN ผิดได้ (ครั้ง)', LOGIN_LOCK_MINUTES: 'ล็อกบัญชี (นาที)', PIN_MIN_LENGTH: 'ความยาว PIN ขั้นต่ำ', SCHEDULER_INTERVAL_MINUTES: 'Scheduler ทุก (นาที)', BACKUP_ENABLED: 'Backup Enabled', BACKUP_HOUR: 'เวลา Backup (ชั่วโมง)', BACKUP_RETENTION_DAYS: 'เก็บ Backup (วัน, 0=ทั้งหมด)' };
    var load = function () {
      return apiCall('settings.get').then(function (d) {
        if (Desk.current !== 'settings') return;
        var byKey = {};
        d.items.forEach(function (i) { byKey[i.key] = i; });
        var field = function (key) {
          var it = byKey[key];
          if (!it) return '';
          var base = { name: key, label: labels[key] || key, value: it.value, hint: it.description };
          if (it.type === 'bool') return formField(Object.assign(base, { type: 'switch', value: it.value === 'TRUE', switchLabel: 'เปิด' }));
          if (it.type === 'time') return formField(Object.assign(base, { type: 'time' }));
          if (it.type === 'notimode') return formField(Object.assign(base, { type: 'select', options: [{ value: 'SUMMARY', label: 'SUMMARY (แนะนำ)' }, { value: 'INSTANT', label: 'INSTANT' }, { value: 'CUTOFF', label: 'CUTOFF' }] }));

          }).join('') + '</div></form>' +
          '<div class="grid-2-even mt-16"><div class="card card-body"><div class="card-title mb-12">' + icon('clock') + 'Triggers</div>' +
          (tr.missing && tr.missing.length ? '<div class="alert alert-warning">' + icon('alert') + '<div>ยังไม่ได้ติดตั้ง: ' + esc(tr.missing.join(', ')) + '</div></div>' : '<div class="alert alert-success">' + icon('checkCircle') + '<div>ติดตั้ง Trigger ครบแล้ว (' + tr.installed.length + ')</div></div>') +
          '<p class="text-sm muted">Scheduler ทำงานล่าสุด: ' + esc(tr.lastRun ? formatDateTime(tr.lastRun) : '-') + '</p><button class="btn btn-outline mt-12" id="stTrig">' + icon('refresh') + '<span>ติดตั้ง/อัปเดต Trigger</span></button></div>' +
          '<div class="card card-body"><div class="card-title mb-12">' + icon('key') + 'Script Properties</div><div class="detail-list">' + Object.keys(props).map(function (k) {
            return '<div class="summary-row"><span class="mono text-sm">' + esc(k) + '</span>' + (props[k] ? '<span class="badge badge-success">ตั้งค่าแล้ว</span>' : '<span class="badge">ยังไม่ได้ตั้งค่า</span>') + '</div>';
          }).join('') + '</div><p class="muted text-sm mt-12">ค่าลับตั้งได้ที่ Apps Script → Project Settings → Script Properties เท่านั้น</p></div></div>' +
          '<div class="card card-body mt-16"><div class="card-title mb-12">' + icon('trash') + 'ข้อมูลตัวอย่าง (Demo)</div><p class="muted text-sm">ลบพนักงาน/เมนู/มื้อที่สร้างจาก seedSampleData() — ไม่กระทบ Config และข้อมูลจริง (ข้อมูลที่ถูกใช้งานแล้วจะถูกปิดใช้งานแทนการลบ)</p><button class="btn btn-outline-danger mt-12" id="stSample">' + icon('trash') + '<span>ล้างข้อมูลตัวอย่าง</span></button></div>';
        var save = $('#stSave');
        save.onclick = function () {
          var vals = readForm($('#stForm'));
          Object.keys(vals).forEach(function (k) { if (typeof vals[k] === 'boolean') vals[k] = vals[k] ? 'TRUE' : 'FALSE'; });
          guard(save, function () { return apiCall('settings.save', { values: vals }).then(function (r) { showToast(r.changed ? 'บันทึกแล้ว ' + r.changed + ' รายการ' + (r.triggerMsg ? ' · ' + r.triggerMsg : '') : 'ไม่มีการเปลี่ยนแปลง', 'success'); return apiCall('auth.me').then(function (m) { App.state.app = m.app; }); }); });
        };

        smp.onclick = function () {
          confirmModal('ล้างข้อมูลตัวอย่างทั้งหมด?', { danger: true, okText: 'ล้างข้อมูลตัวอย่าง', detail: 'Config และข้อมูลจริงจะไม่ถูกลบ' }).then(function (ok) {

        };
      }).catch(function (e) { if (!e.handled) el.innerHTML = errorBlock(e); });
    };
    load();
  }
});
